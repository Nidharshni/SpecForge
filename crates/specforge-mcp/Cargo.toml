[package]
name = "specforge-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

# Its own binary: its global allocator counts what the server holds.
[[test]]
name = "heap"
path = "tests/heap.rs"

[dependencies]
specforge-diagnostics = { path = "../specforge-diagnostics" }
specforge-common = { workspace = true }
specforge-graph = { path = "../specforge-graph" }
specforge-emitter = { path = "../specforge-emitter" }
specforge-component = { path = "../specforge-component" }
specforge-registry = { workspace = true }
specforge-formatter = { workspace = true }
specforge-mcp-macros = { path = "../specforge-mcp-macros" }
specforge-ops = { workspace = true }
specforge-ops-registry = { path = "../specforge-ops-registry" }
specforge-project = { workspace = true }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-wasm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = "0.4.41"

[dev-dependencies]
specforge-extension-sdk = { path = "../specforge-extension-sdk" }
# Candidates served in process (`specforge_ops::testing`).
specforge-ops = { workspace = true, features = ["testing"] }
# Extensions served in process (`specforge_wasm::testing`).
specforge-wasm = { workspace = true, features = ["testing"] }
specforge-installed = { path = "../specforge-installed", features = ["testing"] }
specforge-parser = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
