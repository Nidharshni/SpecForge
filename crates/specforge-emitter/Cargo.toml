[package]
name = "specforge-emitter"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
# Export formats only: no Wasm runtime, no compile, no I/O
# (ADR 0004 D1-d).
specforge-graph = { path = "../specforge-graph" }
specforge-registry = { workspace = true }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-diagnostics = { path = "../specforge-diagnostics" }
specforge-common = { path = "../specforge-common" }
# A node's coverage status (`Verdict::status`): pure, no I/O (ADR 0004 D1-d).
specforge-coverage = { path = "../specforge-coverage" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
specforge-parser = { workspace = true }
specforge-component = { path = "../specforge-component", features = ["testing"] }
# The outline tests read the real builtin declarations.
specforge-wasm = { path = "../specforge-wasm" }
# Integration tests compile whole projects through the crate built on this one.
specforge-project = { workspace = true }
criterion.workspace = true
insta.workspace = true
tempfile.workspace = true
specforge-test.workspace = true
specforge-test-macros.workspace = true

[[bench]]
name = "emit"
harness = false
