[package]
name = "specforge-ops"
description = "User-level operations shared by the CLI, the MCP server and the LSP: a typed request in, a typed outcome or a refusal out (ADR 0015, ADR 0029)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# `specforge_ops::testing`: extensions a test serves in process as
# candidates (`@sdk/greet`, builtin look-alikes), and a package registry in
# memory beside the Registry port with the contract of the port (ADR 0044).
testing = ["dep:specforge-extension-sdk", "specforge-wasm/testing"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
specforge-diagnostics = { path = "../../leaf/diagnostics" }
specforge-common = { workspace = true }
specforge-emitter = { path = "../../pipeline/emitter" }
specforge-formatter = { workspace = true }
similar = { workspace = true }
specforge-graph = { path = "../../pipeline/graph" }
specforge-migrate = { workspace = true }
specforge-parser = { workspace = true }
specforge-project = { workspace = true }
specforge-package = { path = "../../leaf/package" }
specforge-protocol-types = { path = "../../leaf/protocol-types" }
specforge-registry = { workspace = true }
specforge-wasm = { workspace = true }
specforge-installed = { path = "../../runtime/installed" }
specforge-extension-sdk = { path = "../../runtime/extension-sdk", optional = true }
chrono = "0.4.41"
getrandom = "0.3"
sha2 = { workspace = true }
strsim = { workspace = true }

[dev-dependencies]
specforge-repo-root = { path = "../../leaf/repo-root" }
# The production adapter, in the tests that load the builtins.
specforge-component = { workspace = true, features = ["testing"] }
specforge-ops = { path = ".", features = ["testing"] }
# The project a test builds, and the sample sources.
specforge-project = { workspace = true, features = ["testing"] }
# Extensions declared with the SDK, served in process.
specforge-extension-sdk = { path = "../../runtime/extension-sdk" }
# One diagnostic of each kind the host builds, for the diagnostics JSON pin.
specforge-registry-client = { path = "../../adapters/registry-client" }
specforge-wasm = { workspace = true, features = ["testing"] }
specforge-installed = { path = "../../runtime/installed", features = ["testing"] }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
# The module-group check parses `src/` (tests/operations/groups.rs), with xtask's versions.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
