[package]
name = "specforge-common"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The catalog's title on every diagnostics JSON entry; it has no dependencies.
specforge-diagnostics = { path = "../specforge-diagnostics" }
# `ExtensionEntry` reads package names; `peers` reports the peer rule's verdicts (ADR 0050).
specforge-package = { path = "../specforge-package" }
# `peers` reports on `PeerDependency`; `shape` describes `FieldType`.
specforge-protocol-types = { path = "../specforge-protocol-types" }
# `#[derive(Shape)]`: a type's JSON shape beside its serialization (ADR 0048). A plain
# path dependency, not a workspace entry: that would change the builtin blobs' hash.
specforge-shape-macros = { path = "../specforge-shape-macros" }
# The source-annotated rendering of diagnostics (`render_diagnostics`).
ariadne = { workspace = true }
glob = { workspace = true }
lasso = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strsim = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
