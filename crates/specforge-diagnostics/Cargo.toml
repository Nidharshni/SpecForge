[package]
name = "specforge-diagnostics"
description = "The catalog of SpecForge diagnostic codes: titles, owners, levels and explanations"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
# Linked into the MCP server, whose stdout is the JSON-RPC stream.
print_stdout = "deny"

# No dependencies: every surface (CLI, MCP, LSP, doctor) reads it.

[dev-dependencies]
specforge-repo-root = { path = "../specforge-repo-root" }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
