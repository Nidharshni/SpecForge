[package]
name = "specforge-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

# `cargo binstall --git <repo> specforge-cli` downloads the prebuilt release archive.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/specforge-{ target }{ archive-suffix }"
bin-dir = "specforge-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[test]]
name = "tests"
path = "tests/main.rs"

[[bin]]
name = "specforge"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["string"] }
clap_complete = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specforge-common = { workspace = true }
specforge-diagnostics = { path = "../specforge-diagnostics" }
specforge-formatter = { workspace = true }
specforge-graph = { path = "../specforge-graph" }
specforge-package = { path = "../specforge-package" }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-watch = { path = "../specforge-watch" }
chrono = "0.4.41"
specforge-wasm = { workspace = true }
specforge-component = { workspace = true }
specforge-mcp = { workspace = true }
specforge-ops = { workspace = true }
specforge-ops-registry = { path = "../specforge-ops-registry" }
specforge-project = { workspace = true }
specforge-registry-client = { path = "../specforge-registry-client" }

[dev-dependencies]
sha2 = { workspace = true }
hex = "0.4.3"
specforge-parser = { workspace = true }
specforge-emitter = { path = "../specforge-emitter" }
semver = { workspace = true }
# Extensions declared with the SDK, served in process (`specforge_wasm::testing`).
specforge-extension-sdk = { path = "../specforge-extension-sdk" }
specforge-wasm = { workspace = true, features = ["testing"] }
specforge-installed = { path = "../specforge-installed", features = ["testing"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
specforge-component = { path = "../specforge-component", features = ["testing"] }
specforge-lsp = { path = "../specforge-lsp" }
tokio = { workspace = true }
specforge-registry-server = { path = "../specforge-registry-server", features = ["testing"] }
specforge-registry-client = { path = "../specforge-registry-client", features = ["testing"] }
axum = "0.8.4"
tower-lsp = { workspace = true }
