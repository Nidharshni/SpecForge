[package]
name = "specforge-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
# The in-process runtime adapter (`testing`, plan 03/04).
specforge-extension-sdk = { path = "../specforge-extension-sdk", optional = true }

[features]
# `specforge_wasm::testing::InProcessRuntime`: serve SDK-declared
# extensions in process, for tests of the host.
testing = ["dep:specforge-extension-sdk"]

[dev-dependencies]
specforge-registry = { workspace = true }
# Its own tests use the in-process runtime.
specforge-wasm = { path = ".", features = ["testing"] }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
specforge-extension-sdk = { path = "../specforge-extension-sdk" }
