[package]
name = "specforge-ops-registry"
description = "The package registry behind specforge-ops' Registry port: the fetch policy over the registry client"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lints.clippy]
# MCP owns stdout (it is the JSON-RPC stream): shared operations never print.
print_stdout = "deny"

[dependencies]
serde_json = { workspace = true }
specforge-common = { workspace = true }
specforge-ops = { workspace = true }
specforge-package = { path = "../specforge-package" }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-registry-client = { path = "../specforge-registry-client" }
specforge-registry-wire = { path = "../specforge-registry-wire" }

[dev-dependencies]
specforge-ops = { workspace = true, features = ["testing"] }
hex = "0.4.3"
specforge-registry-client = { path = "../specforge-registry-client", features = ["testing"] }
specforge-registry-server = { path = "../specforge-registry-server", features = ["testing"] }
sha2 = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
