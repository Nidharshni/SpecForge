[package]
name = "specforge-registry"
description = "The Registry build: extension declarations in load order turned into kind, field and edge registries, the rule set and pass order, the entity snapshot of a built graph and the checks over it (ADR 0019, ADR 0031)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
specforge-common = { workspace = true }
specforge-diagnostics = { path = "../../leaf/diagnostics" }
specforge-package = { path = "../../leaf/package" }
specforge-protocol-types = { path = "../../leaf/protocol-types" }
specforge-graph = { path = "../graph" }
specforge-coverage = { path = "../../leaf/coverage" }
# The cycle rules report the members of every cycle (ADR 0196).
specforge-cycles = { path = "../../leaf/cycles" }
specforge-parser = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
specforge-repo-root = { path = "../../leaf/repo-root" }
insta = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
specforge-extension-sdk = { path = "../../runtime/extension-sdk" }

[lints]
workspace = true
