[package]
name = "specforge-formatter"
description = "The .spec formatter: a document, or the blocks a range touches, in canonical layout under its .specforgefmt.toml, a form it cannot read kept as written (ADR 0021, ADR 0063)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-specforge = { workspace = true }
specforge-common = { workspace = true }
specforge-parser = { workspace = true }
toml = { workspace = true }
similar = { workspace = true }

[dev-dependencies]
specforge-graph = { path = "../graph" }
tempfile = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
serde_json = { workspace = true }
