[package]
name = "specforge-graph"
description = "The typed entity graph: the graph build over parsed .spec files, its nodes and edges, the graph delta between two builds, field forms and verify obligations (ADR 0032)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[features]
# `GraphBuild::holding`: a build around a graph a test assembled node by node
# (`specforge_project::testing::Assembled`), and `build_graph` /
# `build_graph_with_config`: a graph with no extension loaded, which no compile
# builds. No production code reads them.
testing = []

[dependencies]
specforge-common = { workspace = true }
specforge-parser = { workspace = true }
specforge-protocol-types = { path = "../../leaf/protocol-types" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
specforge-graph = { path = ".", features = ["testing"] }
criterion = { workspace = true }
tempfile = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }

[[bench]]
name = "graph"
harness = false

[lints]
workspace = true
