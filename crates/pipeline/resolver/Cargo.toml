[package]
name = "specforge-resolver"
description = "Import resolution over a compile's sources: an import names a source by its key, its path relative to the spec root; nothing here reads a file (ADR 0055)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
specforge-common = { workspace = true }
specforge-parser = { workspace = true }
# W113 names the files of every import cycle (ADR 0196).
specforge-cycles = { path = "../../leaf/cycles" }

[dev-dependencies]
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }

[lints]
workspace = true
