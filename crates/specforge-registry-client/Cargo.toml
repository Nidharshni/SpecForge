[package]
name = "specforge-registry-client"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
specforge-common = { workspace = true }
specforge-package = { path = "../specforge-package" }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-registry-wire = { path = "../specforge-registry-wire" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
httpdate = "1"
keyring = "3"
ed25519-dalek = "2.2.0"
getrandom = "0.3"
hex = "0.4.3"
chrono = "0.4.41"

[features]
# A package registry in memory and the client contract (ADR 0044).
testing = []

[dev-dependencies]
specforge-registry-client = { path = ".", features = ["testing"] }
specforge-registry-server = { path = "../specforge-registry-server", features = ["testing"] }
parking_lot = "0.12"
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
