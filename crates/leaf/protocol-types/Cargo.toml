[package]
name = "specforge-protocol-types"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
description = "The guest wire of the SpecForge extension protocol: the handshake, the describe payloads, the operation payloads and the command-arg rule, which the host and every guest compile (ADR 0012, 0013, 0050)"
readme = "../../../docs/extension-protocol.md"

[dependencies]
serde = { workspace = true }
# `raw_value`: the command input splices the host's rendered graph (`RawGraph`).
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
specforge-repo-root = { path = "../repo-root" }
specforge-test-macros = { workspace = true }
specforge-test = { workspace = true }
