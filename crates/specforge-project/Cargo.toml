[package]
name = "specforge-project"
description = "The compiled project: one environment load, one compile, shared by every surface"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[lints.clippy]
# MCP owns stdout (it is the JSON-RPC stream): the shared compile never prints.
print_stdout = "deny"

[dependencies]
specforge-common = { workspace = true }
specforge-component = { workspace = true }
specforge-coverage = { path = "../specforge-coverage" }
specforge-diagnostics = { path = "../specforge-diagnostics" }
specforge-graph = { path = "../specforge-graph" }
specforge-parser = { workspace = true }
specforge-protocol-types = { path = "../specforge-protocol-types" }
specforge-registry = { workspace = true }
specforge-resolver = { path = "../specforge-resolver" }
specforge-wasm = { workspace = true }
specforge-installed = { path = "../specforge-installed" }
tree-sitter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The builtins, loaded outside the extension load by the tests.
specforge-component = { path = "../specforge-component", features = ["testing"] }
# The pipeline tests render what they compile.
specforge-emitter = { path = "../specforge-emitter" }
insta = { workspace = true }
specforge-package = { path = "../specforge-package" }
# Extensions declared with the SDK, served in process.
specforge-extension-sdk = { path = "../specforge-extension-sdk" }
specforge-wasm = { workspace = true, features = ["testing"] }
specforge-installed = { path = "../specforge-installed", features = ["testing"] }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }
