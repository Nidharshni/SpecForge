[package]
name = "specforge-parser"
description = "The .spec language read from text: the one lexer, the recovered syntax, the AST, the expression grammar and the format version (ADR 0038, ADR 0063)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
specforge-common = { workspace = true }
serde = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-specforge = { workspace = true }

[dev-dependencies]
specforge-repo-root = { path = "../../leaf/repo-root" }
criterion = { workspace = true }
insta = { workspace = true }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }

[[bench]]
name = "parse"
harness = false
