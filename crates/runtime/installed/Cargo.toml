[package]
name = "specforge-installed"
description = "A project's installed extensions: layout, specforge.lock, the hash pin, the extension load and the all-or-nothing change"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autotests = false

[[test]]
name = "tests"
path = "tests/main.rs"

[dependencies]
specforge-common = { workspace = true }
specforge-package = { path = "../../leaf/package" }
specforge-protocol-types = { path = "../../leaf/protocol-types" }
specforge-wasm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
semver = { workspace = true }

[features]
# `specforge_installed::testing::install`: what a test that serves an
# extension in process writes so its project loads it from disk.
testing = ["specforge-wasm/testing"]

[dev-dependencies]
specforge-wasm = { workspace = true, features = ["testing"] }
specforge-installed = { path = ".", features = ["testing"] }
specforge-extension-sdk = { path = "../extension-sdk" }
specforge-test = { workspace = true }
specforge-test-macros = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
