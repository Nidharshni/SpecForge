<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="t d">
  <title id="t">specforge check catches a typo and a rule nobody enforces</title>
  <desc id="d">An editor shows the drafted refund behavior with a typo, refund_isued. Running specforge check reports E003 unresolved reference with the hint "did you mean refund_issued", W003 an invariant not enforced by any behavior, W007 an event no behavior produces, and E006 a missing guarantee: 2 errors, 2 warnings. The agent applies the fixes and the second run reports 0 errors, 0 warnings, 0 infos.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #e6edf3; white-space: pre; }
    .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .gut { fill: #6e7681; }
    .kw { fill: #ff7b72; } .id { fill: #d2a8ff; } .str { fill: #a5d6ff; } .fld { fill: #79c0ff; }
    .err { fill: #f85149; font-weight: 700; } .warn { fill: #d29922; font-weight: 700; }
    .help { fill: #56d4dd; } .dim { fill: #8b949e; } .ok { fill: #3fb950; font-weight: 700; }
    .prompt { fill: #3fb950; }

    .a { animation-duration: 14s; animation-iteration-count: infinite; animation-fill-mode: both; }
    .ph1 { animation-name: ph1; }
    @keyframes ph1 { 0%, 48% { opacity: 1; } 51%, 100% { opacity: 0; } }
    .ph2 { animation-name: ph2; opacity: 0; }
    @keyframes ph2 { 0%, 51% { opacity: 0; } 53%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    .in { animation-name: lineIn; animation-timing-function: step-end; }
    @keyframes lineIn { 0% { opacity: 0; } 1%, 80% { opacity: 1; } 81%, 100% { opacity: 0; } }
    .l1 { animation-delay: 1.7s; } .l2 { animation-delay: 1.9s; } .l3 { animation-delay: 2.1s; }
    .l4 { animation-delay: 2.6s; } .l5 { animation-delay: 3.0s; } .l6 { animation-delay: 3.4s; }
    .l7 { animation-delay: 3.9s; }
    .type1 { animation-name: type1; }
    @keyframes type1 { 0%, 3% { transform: translateX(0); animation-timing-function: steps(15, end); }
      10%, 100% { transform: translateX(150px); } }
    .type2 { animation-name: type2; }
    @keyframes type2 { 0%, 57% { transform: translateX(0); animation-timing-function: steps(15, end); }
      64%, 100% { transform: translateX(150px); } }
    .res2 { animation-name: res2; animation-timing-function: step-end; }
    @keyframes res2 { 0%, 66% { opacity: 0; } 67%, 100% { opacity: 1; } }
    .typo { animation-name: typo; }
    @keyframes typo { 0%, 54% { opacity: 1; } 56%, 96% { opacity: 0; } 99%, 100% { opacity: 1; } }
    .fixed { animation-name: fixed; opacity: 0; }
    @keyframes fixed { 0%, 54% { opacity: 0; } 56%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .a { animation: none; }
      .cover { display: none; }
    }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="879" height="459" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 36 V12.5 a12 12 0 0 1 12 -12 h855 a12 12 0 0 1 12 12 V36 z" fill="#161b22"/>
  <line x1="0" y1="36" x2="880" y2="36" stroke="#30363d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/><circle cx="42" cy="18" r="6" fill="#febc2e"/><circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text class="ui dim" x="440" y="23" font-size="12.5" text-anchor="middle">payments — your agent drafted spec/refunds.spec</text>

  <!-- editor -->
  <text class="ui dim" x="24" y="60" font-size="12">spec/refunds.spec</text>
  <g>
    <text class="gut" x="44" y="86" text-anchor="end">12</text>
    <text x="60" y="86"><tspan class="kw">behavior</tspan> <tspan class="id">issue_refund</tspan> <tspan class="str">"Refund a captured payment"</tspan> {</text>
    <text class="gut" x="44" y="105" text-anchor="end">13</text>
    <text x="60" y="105">  <tspan class="fld">category</tspan>   command</text>
    <text class="gut" x="44" y="124" text-anchor="end">14</text>
    <text class="typo a" x="60" y="124">  <tspan class="fld">invariants</tspan> [refund_within_capture]</text>
    <text class="fixed a" x="60" y="124">  <tspan class="fld">invariants</tspan> [refund_within_capture, <tspan class="ok">refund_needs_reason</tspan>]</text>
    <text class="gut" x="44" y="143" text-anchor="end">15</text>
    <g class="typo a">
      <text x="60" y="143">  <tspan class="fld">produces</tspan>   [refund_isued]</text>
      <g class="ph1 a">
        <text class="err in a l1" x="60" y="152" xml:space="preserve">              ~~~~~~~~~~~~</text>
      </g>
    </g>
    <g class="fixed a">
      <text x="60" y="143">  <tspan class="fld">produces</tspan>   [<tspan class="ok">refund_issued</tspan>]</text>
    </g>
    <text class="gut" x="44" y="162" text-anchor="end">16</text>
    <text x="60" y="162">  <tspan class="fld">contract</tspan>   <tspan class="str">"Given a captured payment, refunds up to the captured amount"</tspan></text>
    <text class="gut" x="44" y="181" text-anchor="end">17</text>
    <text x="60" y="181">  <tspan class="fld">verify</tspan> unit <tspan class="str">"refunds the requested amount"</tspan></text>
    <text class="gut" x="44" y="200" text-anchor="end">18</text>
    <text x="60" y="200">}</text>
  </g>

  <!-- terminal -->
  <line x1="0" y1="220" x2="880" y2="220" stroke="#30363d"/>
  <text class="ui dim" x="24" y="244" font-size="11" letter-spacing="1.5">TERMINAL</text>

  <g class="ph1 a">
    <text x="24" y="274"><tspan class="prompt">$</tspan> specforge check</text>
    <rect class="cover type1 a" x="38" y="260" width="160" height="20" fill="#0d1117"/>
    <text class="in a l1" x="24" y="298"><tspan class="err">[E003] Error:</tspan> unresolved reference 'refund_isued' in entity 'issue_refund'</text>
    <text class="in a l2 dim" x="24" y="317" xml:space="preserve">    ╭─[ refunds.spec:15:15 ]</text>
    <text class="in a l3" x="24" y="336" xml:space="preserve"><tspan class="dim">    │ </tspan><tspan class="help">Help: did you mean 'refund_issued'?</tspan></text>
    <text class="in a l4" x="24" y="360"><tspan class="warn">[W003] Warning:</tspan> invariant 'refund_needs_reason' is not enforced by any behavior</text>
    <text class="in a l5" x="24" y="379"><tspan class="warn">[W007] Warning:</tspan> event 'refund_issued' is not produced by any behavior</text>
    <text class="in a l6" x="24" y="398"><tspan class="err">[E006] Error:</tspan> invariant 'refund_within_capture' is missing required field 'guarantee'</text>
    <text class="in a l7" x="24" y="428" font-weight="700">2 errors, 2 warnings, 0 infos</text>
  </g>

  <g class="ph2 a">
    <text class="dim" x="24" y="274"># your agent applies the fix hints, then checks again</text>
    <text x="24" y="298"><tspan class="prompt">$</tspan> specforge check</text>
    <rect class="cover type2 a" x="38" y="284" width="160" height="20" fill="#0d1117"/>
    <text class="res2 a ok" x="24" y="322">0 errors, 0 warnings, 0 infos</text>
    <text class="res2 a dim" x="24" y="356"># next: link your tests to these entities, then run specforge collect</text>
  </g>
</svg>
