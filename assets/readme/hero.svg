<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d">
  <title id="t">SpecForge</title>
  <desc id="d">Turn your team's expertise into rules your AI can't skip. AI drafts, SpecForge checks, you sign.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .core { animation: pulse 3s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .55; } to { opacity: .95; } }
    .lit { opacity: 0; animation: lit 6s ease-in-out infinite; }
    .lit2 { animation-delay: 2s; }
    .lit3 { animation-delay: 4s; }
    @keyframes lit { 0% { opacity: 0; } 8% { opacity: 1; } 30% { opacity: 1; } 40% { opacity: 0; } 100% { opacity: 0; } }
    .spark { opacity: 0; animation: spark 6s linear infinite; }
    .spark2 { animation-delay: 2s; }
    @keyframes spark {
      0%, 22% { opacity: 0; transform: translateX(0); }
      25% { opacity: 1; transform: translateX(0); }
      36% { opacity: 1; transform: translateX(24px); }
      38%, 100% { opacity: 0; transform: translateX(24px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .core, .lit, .spark { animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="bg" cx="25%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#171A21"/>
      <stop offset="100%" stop-color="#090A0D"/>
    </radialGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C313E"/>
      <stop offset="100%" stop-color="#11131A"/>
    </linearGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#464D60"/>
      <stop offset="100%" stop-color="#1D212B"/>
    </linearGradient>
    <radialGradient id="coreEnergy" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFDD7A"/>
      <stop offset="60%" stop-color="#FF5D00"/>
      <stop offset="100%" stop-color="#FF5D00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="880" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="300" fill="url(#bg)"/>
    <rect width="880" height="300" fill="url(#grid)"/>
  </g>

  <!-- The forge: the logo's cube, with a breathing core -->
  <g transform="translate(165,185) scale(0.85)">
    <polygon points="0,-40 69.28,-80 0,-120 -69.28,-80" fill="#0A0B0E" stroke="#FF5D00" stroke-width="1" opacity="0.4"/>
    <circle class="core" cx="0" cy="-20" r="45" fill="url(#coreEnergy)" filter="url(#glow)"/>
    <g filter="url(#glow)">
      <line x1="0" y1="-20" x2="-30" y2="-5" stroke="#FFDD7A" stroke-width="2"/>
      <line x1="0" y1="-20" x2="30" y2="-5" stroke="#FFDD7A" stroke-width="2"/>
      <line x1="0" y1="-20" x2="0" y2="15" stroke="#FFDD7A" stroke-width="2"/>
      <circle cx="-30" cy="-5" r="4" fill="#FFF"/>
      <circle cx="30" cy="-5" r="4" fill="#FFF"/>
      <circle cx="0" cy="15" r="4" fill="#FFF"/>
      <circle cx="0" cy="-20" r="6" fill="#FFF"/>
    </g>
    <path d="M -86.6,-50 L 0,0 L 0,60 L -86.6,10 Z" fill="url(#metalDark)" filter="url(#shadow)"/>
    <path d="M 86.6,-50 L 0,0 L 0,60 L 86.6,10 Z" fill="url(#metalLight)" filter="url(#shadow)"/>
    <path d="M 0,-100 L 86.6,-50 L 0,0 L -86.6,-50 Z" fill="none" stroke="url(#metalLight)" stroke-width="14" stroke-linejoin="bevel" filter="url(#shadow)"/>
    <circle cx="-86.6" cy="-50" r="6" fill="#FF5D00" filter="url(#glow)"/>
    <circle cx="86.6" cy="-50" r="6" fill="#FF5D00" filter="url(#glow)"/>
    <circle cx="0" cy="60" r="6" fill="#FF5D00" filter="url(#glow)"/>
    <path d="M -86.6,-50 L -120,-70" stroke="#464D60" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 86.6,-50 L 120,-70" stroke="#464D60" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 0,60 L 0,100" stroke="#464D60" stroke-width="1.5" stroke-dasharray="4 4"/>
  </g>

  <!-- Wordmark and promise -->
  <text class="sans" x="330" y="78" font-size="26" letter-spacing="6" fill="#FFFFFF">SPEC<tspan font-weight="800" fill="#FF5D00">FORGE</tspan></text>
  <text class="sans" x="330" y="128" font-size="25" font-weight="600" fill="#F2F3F5">Turn your team's expertise into</text>
  <text class="sans" x="330" y="160" font-size="25" font-weight="600" fill="#F2F3F5">rules your AI <tspan fill="#FFB27A">can't skip.</tspan></text>

  <!-- AI drafts → SpecForge checks → You sign -->
  <g class="sans" font-size="15" font-weight="600" text-anchor="middle">
    <g transform="translate(330,206)">
      <rect width="150" height="40" rx="20" fill="#1A1D25" stroke="#8B6BEF" stroke-opacity=".6"/>
      <rect class="lit" width="150" height="40" rx="20" fill="#8B6BEF" fill-opacity=".22" stroke="#B49CFF" stroke-width="2"/>
      <circle cx="24" cy="20" r="5" fill="#B49CFF"/>
      <text x="82" y="25" fill="#E7E0FF">AI drafts</text>
    </g>
    <g transform="translate(510,206)">
      <rect width="190" height="40" rx="20" fill="#1A1D25" stroke="#FF5D00" stroke-opacity=".6"/>
      <rect class="lit lit2" width="190" height="40" rx="20" fill="#FF5D00" fill-opacity=".22" stroke="#FF8A3D" stroke-width="2"/>
      <circle cx="24" cy="20" r="5" fill="#FF8A3D"/>
      <text x="104" y="25" fill="#FFE3D1">SpecForge checks</text>
    </g>
    <g transform="translate(730,206)">
      <rect width="130" height="40" rx="20" fill="#1A1D25" stroke="#3FB950" stroke-opacity=".6"/>
      <rect class="lit lit3" width="130" height="40" rx="20" fill="#3FB950" fill-opacity=".22" stroke="#56D364" stroke-width="2"/>
      <circle cx="24" cy="20" r="5" fill="#56D364"/>
      <text x="72" y="25" fill="#D8F5DD">You sign</text>
    </g>
  </g>
  <g stroke="#687187" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M484 226 h20 m-6 -5 l6 5 l-6 5"/>
    <path d="M704 226 h20 m-6 -5 l6 5 l-6 5"/>
  </g>
  <circle class="spark" cx="482" cy="226" r="4" fill="#FFDD7A" filter="url(#glow)"/>
  <circle class="spark spark2" cx="702" cy="226" r="4" fill="#FFDD7A" filter="url(#glow)"/>

  <text class="mono" x="330" y="276" font-size="11" letter-spacing="3" fill="#687187">A COMPILER FOR WHAT YOU MEAN</text>
</svg>
