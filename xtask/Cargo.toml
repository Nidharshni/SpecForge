[package]
name = "xtask"
description = "Repository tasks that link the workspace: build-blobs, revendor, check-links and check-modules"
edition = "2024"
version = "0.1.0"
publish = false

[[bin]]
name = "build-blobs"
path = "src/build_blobs.rs"

[[bin]]
name = "revendor"
path = "src/revendor.rs"

[[bin]]
name = "check-links"
path = "src/check_links.rs"

[[bin]]
name = "check-modules"
path = "src/check_modules.rs"

[dependencies]
specforge-repo-root = { path = "../crates/leaf/repo-root" }
specforge-common = { workspace = true }
specforge-coverage = { path = "../crates/leaf/coverage" }
specforge-project = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
strsim = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
walkdir = { workspace = true }
specforge-component = { path = "../crates/runtime/component", features = ["testing"] }
specforge-installed = { path = "../crates/runtime/installed" }
specforge-wasm = { path = "../crates/runtime/wasm" }
specforge-protocol-types = { path = "../crates/leaf/protocol-types" }
serde_json = "1.0"
gate = { path = "../gate" }
