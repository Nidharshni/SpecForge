[package]
name = "xtask"
edition = "2024"
version = "0.1.0"
publish = false

[[bin]]
name = "build-blobs"
path = "src/build_blobs.rs"

[[bin]]
name = "revendor"
path = "src/revendor.rs"

[[bin]]
name = "check-links"
path = "src/check_links.rs"

[dependencies]
specforge-common = { workspace = true }
specforge-coverage = { path = "../crates/specforge-coverage" }
specforge-project = { workspace = true }
proc-macro2 = { version = "1", features = ["span-locations"] }
strsim = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
walkdir = { workspace = true }
specforge-component = { path = "../crates/specforge-component", features = ["testing"] }
specforge-installed = { path = "../crates/specforge-installed" }
specforge-wasm = { path = "../crates/specforge-wasm" }
specforge-protocol-types = { path = "../crates/specforge-protocol-types" }
serde_json = "1.0"
gate = { path = "../gate" }
