[profile.default]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 2 }
status-level = "fail"

# CI (`cargo gate ci`): tests run beside clippy and the guests, as they do
# locally, so the watcher tests get the `gate` profile's room.
[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "all"

# `cargo gate` (quick and full): every failure, no retries, and room for the
# watcher tests (~40 s each when run alongside clippy) before a hang is killed.
[profile.gate]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"

# Builds a scaffolded extension crate from cold, in a fresh directory: a
# real `cargo build --release --target wasm32-wasip2` of the SDK and its
# dependencies, which takes minutes on a loaded machine. Inherited by every
# profile.
[[profile.default.overrides]]
filter = "package(specforge-cli) & test(=extension_authoring::a_scaffolded_extension_builds_and_validates)"
slow-timeout = { period = "60s", terminate-after = 10 }
