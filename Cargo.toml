[workspace]
resolver = "3"
exclude = ["extensions", "fixtures"]
members = [
    # leaf
    "crates/leaf/coverage",
    "crates/leaf/diagnostics",
    "crates/leaf/package",
    "crates/leaf/protocol-types",
    "crates/leaf/repo-root",
    # kernel
    "crates/kernel/common",
    "crates/kernel/parser",
    "crates/kernel/shape-macros",
    "crates/kernel/tree-sitter",
    # pipeline
    "crates/pipeline/emitter",
    "crates/pipeline/formatter",
    "crates/pipeline/graph",
    "crates/pipeline/migrate",
    "crates/pipeline/registry",
    "crates/pipeline/resolver",
    # runtime
    "crates/runtime/component",
    "crates/runtime/extension-sdk",
    "crates/runtime/extension-sdk-macros",
    "crates/runtime/installed",
    "crates/runtime/wasm",
    # session
    "crates/session/project",
    "crates/session/watch",
    # app
    "crates/app/ops",
    # adapters
    "crates/adapters/ops-registry",
    "crates/adapters/registry-client",
    "crates/adapters/registry-wire",
    # surfaces
    "crates/surfaces/cli",
    "crates/surfaces/lsp",
    "crates/surfaces/mcp",
    "crates/surfaces/mcp-macros",
    "crates/surfaces/registry-server",
    "xtask",
    "gate",
]

# One lint policy for every workspace member (ADR 0089). An exception is an `#[expect(lint, reason = "...")]` on
# the item it excuses; `#[allow]` only where an `expect` cannot hold (macro output, a module shared by several test
# binaries, a test crate's root).
[workspace.lints.rust]
# Production unsafe is the tree-sitter FFI; each unsafe item says why it is sound.
unsafe_code = "deny"

[workspace.lints.clippy]
# An `unwrap` states no invariant. `expect("...")` names the one it relies on; a fallible input returns an error.
unwrap_used = "deny"
# MCP and the LSP own stdout: it is their protocol stream. A binary that owns its stdout says so.
print_stdout = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every `#[allow]` that remains says why.
allow_attributes_without_reason = "deny"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leaderiop/SpecForge"

[workspace.dependencies]
# Internal
specforge-common = { path = "crates/kernel/common" }
specforge-formatter = { path = "crates/pipeline/formatter" }
specforge-parser = { path = "crates/kernel/parser" }
specforge-registry = { path = "crates/pipeline/registry" }
specforge-mcp = { path = "crates/surfaces/mcp" }
specforge-migrate = { path = "crates/pipeline/migrate" }
specforge-ops = { path = "crates/app/ops" }
specforge-project = { path = "crates/session/project" }
specforge-wasm = { path = "crates/runtime/wasm" }
specforge-component = { path = "crates/runtime/component" }
tree-sitter-specforge = { path = "crates/kernel/tree-sitter" }

# External
tree-sitter = "0.26.6"
tree-sitter-language = "0.1.7"
lasso = { version = "0.7.3", features = ["multi-threaded"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ariadne = "0.6.0"
sha2 = "0.10.9"
semver = "1.0.28"
regex = "1.12.4"
strsim = "0.11.1"
walkdir = "2.5.0"
toml = "0.8.22"
glob = "0.3.2"
similar = "2.7"

# Build
cc = "1.2.56"

# Watch
notify = "8.2.0"

# LSP
tower-lsp = "0.20.0"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time"] }

# HTTP
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "json", "blocking", "multipart"] }

# CLI
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.50"

# Benchmarks
criterion = { version = "0.5.1", features = ["html_reports"] }

# Dev/test
assert_cmd = "2.1.2"
predicates = "3.1.3"
insta = { version = "1.46.3", features = ["json"] }
tempfile = "3.26.0"
specforge-test = { path = "integrations/rust/specforge-test" }
specforge-test-macros = { path = "integrations/rust/specforge-test-macros" }

[profile.dev]
# Line tables only: backtraces keep file:line, and binaries stay small, so
# they link faster (and, on macOS, pass the first-launch scan faster).
debug = "line-tables-only"

[profile.test]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = true
strip = true

# The committed wasm blobs (`xtask build-blobs`, ADR 0114): small over fast. Inherited into the
# blob stage like the lint tables. Trap frames lose function names (strip); rebuild an extension
# without this profile to debug it.
[profile.blob]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
