[package]
name = "specforge-test"
version = "0.1.0"
edition = "2021"
description = "Test traceability for SpecForge — link Rust tests to spec entities"
license = "MIT OR Apache-2.0"

[dependencies]
specforge-test-macros = { path = "../specforge-test-macros" }
specforge-protocol-types = { path = "../../../crates/leaf/protocol-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
crossbeam-queue = "0.3"

[dev-dependencies]
specforge-repo-root = { path = "../../../crates/leaf/repo-root" }
tempfile = "3"

[lints]
workspace = true
