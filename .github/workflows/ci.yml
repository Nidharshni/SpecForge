name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    # Every check a full run reaches (`cargo gate list`), with the ci nextest profile.
    name: Check list
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Install z3 (SMT solver for prove tests)
        run: sudo apt-get update && sudo apt-get install -y z3

      # tree-sitter-cli and cargo-audit are installed by the checks that need them, at the versions the list pins.
      - name: Run the check list
        run: cargo gate ci

  bootstrap:
    name: Fresh-clone bootstrap (builtin components)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # No rust-cache here on purpose: this job must prove that a cold clone
      # can rebuild every builtin component blob from source via the xtask
      # escape hatch (wayfinder map #1, ticket #4).
      # Each blob is built in a staged workspace, so its bytes do not depend on the
      # checkout path: --verify rebuilds every committed blob (the builtins and the fixtures) and fails if one differs from the
      # vendored bytes (a blob vendored by another rustc is built, not compared).
      - name: Build all builtin component blobs from source and compare them with the vendored ones
        run: cargo gate bootstrap
